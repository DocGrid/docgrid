def realPdfEmbeddingCorpusOutput = layout.buildDirectory.file(
	'reports/real-pdf-embedding/real-pdf-corpus.json'
)

tasks.register('realPdfEmbeddingCorpus', JavaExec) {
	group = 'verification'
	description = '외부 실제 PDF를 운영 Parser와 Chunker로 처리해 Git 제외 Benchmark Corpus를 생성합니다.'
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.opensource.docgrid.domain.embedding.benchmark.RealPdfEmbeddingCorpusExporter'
	doFirst {
		def rawPaths = System.getenv('REAL_PDF_PATHS')
		if (rawPaths == null || rawPaths.isBlank()) {
			throw new GradleException('REAL_PDF_PATHS에 실제 PDF 경로를 경로 구분자로 지정해야 합니다.')
		}
		def pdfPaths = rawPaths.split(java.util.regex.Pattern.quote(File.pathSeparator))
			.findAll { !it.isBlank() }
		args realPdfEmbeddingCorpusOutput.get().asFile.absolutePath
		args pdfPaths
	}
	// 실제 PDF 원문을 포함한 결과는 build/reports에만 생성하고 Build Cache에서 재사용하지 않는다.
	outputs.upToDateWhen { false }
}

