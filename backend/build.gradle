def configureOpenSqlDatabase = { Test task ->
	task.maxParallelForks = 1
	task.outputs.upToDateWhen { false }
	task.doFirst {
		def environmentMappings = [
			OPENSQL_DB_HOST: 'DB_HOST',
			OPENSQL_DB_PORT: 'DB_PORT',
			OPENSQL_DB_NAME: 'DB_NAME',
			OPENSQL_DB_USER: 'DB_USER',
			OPENSQL_DB_PASSWORD: 'DB_PASSWORD',
			OPENSQL_DB_SSLMODE: 'DB_SSLMODE'
		]
		environmentMappings.each { sourceName, targetName ->
			def value = System.getenv(sourceName)
			if (value == null || value.trim().isEmpty()) {
				throw new GradleException("필수 공식 OpenSQL 환경 변수가 비어 있습니다: ${sourceName}")
			}
			task.environment(targetName, value)
		}
		// 공식 접속 정보와 분리된 Test 전용 JWT만 사용하고 값은 Task 출력에 기록하지 않는다.
		task.environment(
			'JWT_SECRET',
			System.getenv('OPENSQL_JWT_SECRET') ?: 'docgrid-opensql-verification-test-secret-key-2026'
		)
	}
}

def configureOpenSqlExternalServices = { Test task ->
	task.doFirst {
		// 실제 외부 Service 값이 없으면 공식 E2E가 Local 기본값으로 통과하는 것을 차단한다.
		def environmentMappings = [
			OPENSQL_MINIO_ENDPOINT: 'MINIO_ENDPOINT',
			OPENSQL_MINIO_ACCESS_KEY: 'MINIO_ACCESS_KEY',
			OPENSQL_MINIO_SECRET_KEY: 'MINIO_SECRET_KEY',
			OPENSQL_EMBEDDING_SERVER_URL: 'EMBEDDING_SERVER_URL'
		]
		environmentMappings.each { sourceName, targetName ->
			def value = System.getenv(sourceName)
			if (value == null || value.trim().isEmpty()) {
				throw new GradleException("필수 공식 OpenSQL E2E 환경 변수가 비어 있습니다: ${sourceName}")
			}
			task.environment(targetName, value)
		}
	}
}

