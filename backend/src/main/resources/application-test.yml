spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:55432}/${DB_NAME:app}?currentSchema=${TEST_DB_SCHEMA:docgrid_test},public&sslmode=${DB_SSLMODE:disable}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:local_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed
    default-schema: ${TEST_DB_SCHEMA:docgrid_test}
    schemas: ${TEST_DB_SCHEMA:docgrid_test}
    create-schemas: true

storage:
  type: local
  bucket: test-bucket
  local:
    root: ./build/test-file-storage

minio:
  endpoint: http://localhost:9000
  access-key: test-access-key
  secret-key: test-secret-key

indexing:
  worker:
    # E2E 테스트가 빈 Queue Backoff 상한 때문에 오래 대기하지 않도록 테스트 환경만 짧게 유지한다.
    idle-max-polling-interval: ${INDEXING_WORKER_IDLE_MAX_POLLING_INTERVAL:1s}
    # 기본 통합 테스트는 결정적인 Backoff를 사용하고, 분포 테스트만 Jitter를 명시적으로 활성화한다.
    retry-jitter-ratio: ${INDEXING_WORKER_RETRY_JITTER_RATIO:0.0}
