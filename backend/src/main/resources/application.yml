spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: docgrid
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 50MB
      # Multipart 메타데이터를 포함할 수 있도록 파일 제한보다 요청 제한을 넉넉하게 둔다.
      max-request-size: 60MB
  jpa:
    # 전역 OSIV를 끄고, WebMvcConfig에서 /mcp를 제외한 나머지 경로에만 다시 등록한다.
    # /mcp는 MCP Streamable HTTP 응답 처리 방식과 OSIV가 충돌해 DB 커넥션이 누수됐다(#120).
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # 인증 요청마다 동기 조회하므로, Redis가 응답하지 않을 때 fail-open이 빠르게 동작하도록 짧게 제한한다.
      timeout: ${REDIS_TIMEOUT:1s}
  ai:
    mcp:
      server:
        name: docgrid-mcp-server
        protocol: STREAMABLE
        type: SYNC
        annotation-scanner:
          enabled: true
  task:
    scheduling:
      pool:
        # DB Claim 지연이 Worker Heartbeat·Lease 복구 실행을 막지 않도록, Dashboard debounce push까지
        # 포함해 네 작업을 분리한다.
        size: 4

dashboard:
  push:
    # 짧은 시간에 몰리는 Job 상태 전이 이벤트를 이 주기로 모아서 한 번만 집계·push한다(debounce).
    debounce-interval-ms: ${DASHBOARD_PUSH_DEBOUNCE_INTERVAL_MS:300}

document:
  upload:
    max-file-size: 50MB
  chunking:
    chunk-size: ${DOCUMENT_CHUNK_SIZE:1000}
    overlap: ${DOCUMENT_CHUNK_OVERLAP:200}

storage:
  # 별도 설정이 없으면 외부 Object Storage 없이 실행할 수 있는 Local Filesystem을 사용한다.
  type: ${STORAGE_TYPE:local}
  # MinIO/S3에서는 Bucket, Local Filesystem에서는 DB에 기록할 논리 Namespace다.
  # Local만 docgrid 기본 Namespace를 사용하며 외부 저장소는 STORAGE_BUCKET을 반드시 명시한다.
  bucket: ${STORAGE_BUCKET:}
  local:
    root: ${STORAGE_LOCAL_ROOT:./data/docgrid}

s3:
  region: ${AWS_REGION:ap-northeast-2}
  # AWS S3는 빈 값으로 두고 LocalStack·VPC Endpoint 등 명시적 Override가 필요할 때만 설정한다.
  endpoint: ${S3_ENDPOINT:}
  path-style-access-enabled: ${S3_PATH_STYLE_ACCESS_ENABLED:false}
  # 값이 없으면 AWS SDK 기본 Credential Chain(Profile, EC2 Role 등)을 사용한다.
  access-key: ${AWS_ACCESS_KEY_ID:}
  secret-key: ${AWS_SECRET_ACCESS_KEY:}
  session-token: ${AWS_SESSION_TOKEN:}

indexing:
  worker:
    enabled: ${INDEXING_WORKER_ENABLED:false}
    name: ${INDEXING_WORKER_NAME:indexing-worker}
    heartbeat-interval: ${INDEXING_WORKER_HEARTBEAT_INTERVAL:10s}
    dead-threshold: ${INDEXING_WORKER_DEAD_THRESHOLD:30s}
    polling-interval: ${INDEXING_WORKER_POLLING_INTERVAL:1s}
    idle-max-polling-interval: ${INDEXING_WORKER_IDLE_MAX_POLLING_INTERVAL:10s}
    max-concurrency: ${INDEXING_WORKER_MAX_CONCURRENCY:2}
    lease-duration: ${INDEXING_WORKER_LEASE_DURATION:5m}
    lease-renewal-interval: ${INDEXING_WORKER_LEASE_RENEWAL_INTERVAL:1m}
    lease-recovery-interval: ${INDEXING_WORKER_LEASE_RECOVERY_INTERVAL:30s}
    lease-recovery-batch-size: ${INDEXING_WORKER_LEASE_RECOVERY_BATCH_SIZE:100}
    # Retry 지연은 10초부터 지수 증가하며 운영 기본 상한인 5분에서 제한한다.
    retry-initial-delay: ${INDEXING_WORKER_RETRY_INITIAL_DELAY:10s}
    retry-max-delay: ${INDEXING_WORKER_RETRY_MAX_DELAY:5m}
    retry-jitter-ratio: ${INDEXING_WORKER_RETRY_JITTER_RATIO:0.2}
    shutdown-grace-period: ${INDEXING_WORKER_SHUTDOWN_GRACE_PERIOD:30s}

sync:
  dispatcher:
    enabled: ${SYNC_DISPATCHER_ENABLED:false}
    name: ${SYNC_DISPATCHER_NAME:sync-dispatcher}
    polling-interval: ${SYNC_DISPATCHER_POLLING_INTERVAL:1s}
    lease-duration: ${SYNC_DISPATCHER_LEASE_DURATION:30s}
    lease-recovery-interval: ${SYNC_DISPATCHER_LEASE_RECOVERY_INTERVAL:10s}
    lease-recovery-batch-size: ${SYNC_DISPATCHER_LEASE_RECOVERY_BATCH_SIZE:100}
    retry-initial-delay: ${SYNC_DISPATCHER_RETRY_INITIAL_DELAY:5s}
    retry-max-delay: ${SYNC_DISPATCHER_RETRY_MAX_DELAY:1m}
  reconciliation:
    enabled: ${SYNC_RECONCILIATION_ENABLED:false}
    mode: ${SYNC_RECONCILIATION_MODE:DRY_RUN}
    batch-size: ${SYNC_RECONCILIATION_BATCH_SIZE:100}
    interval: ${SYNC_RECONCILIATION_INTERVAL:5m}
    stalled-threshold: ${SYNC_RECONCILIATION_STALLED_THRESHOLD:15m}

server:
  port: 8080

management:
  server:
    # 운영 엔드포인트를 사용자 API와 다른 네트워크 경계에서 제어할 수 있도록 별도 포트로 분리한다.
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      # 운영 정보의 우발적 노출을 막고 수집·상태 확인에 필요한 엔드포인트만 공개한다.
      exposure:
        include: health,prometheus
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          # Redis는 인증 경로에서 fail-open이므로 트래픽 수신 가능 여부는 애플리케이션과 DB로 판단한다.
          include: readinessState,db

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600}

embedding:
  server:
    base-url: ${EMBEDDING_SERVER_URL:http://localhost:8000}
    connect-timeout: ${EMBEDDING_SERVER_CONNECT_TIMEOUT:5s}
    read-timeout: ${EMBEDDING_SERVER_READ_TIMEOUT:5s}
  document:
    # PDF 동시 부하 p99의 2배 이상을 보장하되 단건 검색의 5초 예산은 유지한다.
    read-timeout: ${EMBEDDING_DOCUMENT_READ_TIMEOUT:30s}
  provider:
    circuit-breaker:
      enabled: ${EMBEDDING_PROVIDER_CIRCUIT_BREAKER_ENABLED:true}
      failure-threshold: ${EMBEDDING_PROVIDER_CIRCUIT_BREAKER_FAILURE_THRESHOLD:3}
      open-duration: ${EMBEDDING_PROVIDER_CIRCUIT_BREAKER_OPEN_DURATION:30s}
    # 실제 PDF 3건의 Batch 4·8·16 비교에서 동시 부하 최고 처리량과 최소 p99·RSS를 모두 달성한 값이다.
    batch-size: ${EMBEDDING_DOCUMENT_BATCH_SIZE:4}
    # Chunk 개수만 같아도 입력 길이가 크게 다를 수 있어 Unicode 문자와 저장된 Token 예산을 함께 제한한다.
    max-code-points: ${EMBEDDING_DOCUMENT_MAX_CODE_POINTS:4000}
    max-estimated-tokens: ${EMBEDDING_DOCUMENT_MAX_ESTIMATED_TOKENS:900}

search:
  vector:
    # Top-K 후보 중 이 코사인 유사도 이상인 Chunk만 검색 결과와 RAG 문맥으로 사용한다.
    min-similarity: ${SEARCH_VECTOR_MIN_SIMILARITY:0.30}
    # 한 문서가 검색 결과와 RAG 문맥을 독점하지 않도록 문서별 Chunk 수를 제한한다.
    max-chunks-per-document: ${SEARCH_VECTOR_MAX_CHUNKS_PER_DOCUMENT:2}
    # HNSW 순서를 유지하면서 문서 다양성 필터에 필요한 후보만 제한적으로 추가 조회한다.
    candidate-pool-multiplier: ${SEARCH_VECTOR_CANDIDATE_POOL_MULTIPLIER:4}

ollama:
  server:
    base-url: ${OLLAMA_SERVER_URL:http://localhost:11434}
    # #218에서 검색-RAG를 비동기 Job 큐로 전환한 뒤로는 프론트가 이 호출을 동기로 기다리지
    # 않는다 — "프론트 29초 제한 전에 끝내야 한다"는 예전 제약이 사라졌으므로, 이 값은 이제
    # "Ollama 서버가 아예 응답하지 않을 때 빨리 실패 처리하는" 순수 인프라 안전장치로만 쓰인다.
    connect-timeout: ${OLLAMA_SERVER_CONNECT_TIMEOUT:3s}
    # 요청 시작부터 스트리밍 본문 수신까지 전체에 적용되는 전송 계층 제한(Spring JdkClientHttpRequestFactory가
    # 본문 스트림에도 적용). 스트림이 멈췄을 때의 최후 방어선이며, 이때도 이미 받은 부분 답변은 보존된다.
    # 정상 스트림의 시간 상한은 ollama.generate-deadline이 먼저 담당하므로 이 값은 그보다 커야 한다.
    read-timeout: ${OLLAMA_SERVER_READ_TIMEOUT:90s}
  model: ${OLLAMA_MODEL:qwen2.5:7b}
  # 요청 사이 모델을 상주시켜 매 요청마다 재로딩(수 초)이 발생하지 않게 한다.
  keep-alive: ${OLLAMA_KEEP_ALIVE:30m}
  # 생성 토큰 수 상한. 시간 상한은 generate-deadline이 담당하므로 여기는 답변이 무한정 길어지는
  # 것만 막는다 — 스트리밍 전환으로 250까지 조이던 것을 완화했다 (디코드가 빠른 세션에서는 더 긴 답변 허용).
  num-predict: ${OLLAMA_NUM_PREDICT:400}
  # 스트리밍 생성의 전체 데드라인. #218 이전에는 "프론트 29초 제한보다 확실히 작아야" 했지만(25s),
  # 비동기 전환 이후에는 그 압박이 없다 — 역할이 "느긋하게 기다려주는 상한"에서 "Worker가 멈춘
  # 요청 하나 때문에 큐 전체가 막히지 않도록 하는 안전장치"로 바뀌었다. 그래서 정상적으로 가장
  # 오래 걸렸던 실측치(약 33초, 실사용 QA 패턴 기준)보다 넉넉히 크게 60초로 늘렸다.
  generate-deadline: ${OLLAMA_GENERATE_DEADLINE:60s}
  # RAG는 문서 내용을 그대로 답하는 용도라 창의성이 불필요하다. 낮은 temperature/top-p로
  # 확률 꼬리의 한자·가나 토큰이 뽑힐 확률을 줄여 한국어 답변에 중국어/일본어가 섞이는 것을 완화한다.
  temperature: ${OLLAMA_TEMPERATURE:0.3}
  top-p: ${OLLAMA_TOP_P:0.8}
  # Ollama 기본값이 1.0(반복 억제 없음)으로 확인됨 — 모델이 답을 끝내고도 "한국어로만 답변했습니다"류의
  # 잡담을 반복하며 토큰 상한까지 채우는 루프를 억제한다.
  repeat-penalty: ${OLLAMA_REPEAT_PENALTY:1.1}
  # repeat_penalty가 되돌아보는 토큰 창. 기본 64로는 64토큰보다 긴 블록이 통째로 반복되는 것을
  # 못 잡아서 넓혔다. 목록형 답변의 정당한 반복 표현이 어색해지면 128로 낮춰볼 것.
  repeat-last-n: ${OLLAMA_REPEAT_LAST_N:256}

rag:
  worker:
    # RagJobWorker가 PROCESSING 건이 있는지 확인하는 주기. Worker가 1개뿐이라 짧게 잡아도
    # 부하가 안 크고, 사용자 체감 지연에 직접 영향을 주므로 1초로 짧게 유지한다.
    polling-interval: ${RAG_WORKER_POLLING_INTERVAL:1s}
    # 이 시간 이상 PROCESSING으로 남아있으면(정상 백로그든 실제 hang이든 원인 불문) RagJobTimeoutSweeper가
    # 무기한 대기시키지 않고 강제로 fallback 답변을 채워 종료한다(#286).
    stale-threshold: ${RAG_WORKER_STALE_THRESHOLD:90s}
    # RagJobTimeoutSweeper가 위 stale-threshold 기준을 얼마나 자주 확인할지.
    timeout-sweep-interval: ${RAG_WORKER_TIMEOUT_SWEEP_INTERVAL:15s}
