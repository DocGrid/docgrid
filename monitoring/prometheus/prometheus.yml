global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: docgrid-backend
    metrics_path: /actuator/prometheus
    file_sd_configs:
      # Host 실행과 외부 배포의 차이는 target 파일에서만 관리해 본체 설정을 공유한다.
      - files:
          - /etc/prometheus/targets/docgrid-backend.yml

  - job_name: embedding-provider
    metrics_path: /metrics
    static_configs:
      - targets:
          - embedding-server:8000
