global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: docgrid-backend
    metrics_path: /actuator/prometheus
    file_sd_configs:
      # Host 실행과 외부 배포의 차이는 target 파일에서만 관리해 본체 설정을 공유한다.
      - files:
          - /etc/prometheus/targets/docgrid-backend.yml

  - job_name: embedding-provider
    metrics_path: /metrics
    file_sd_configs:
      # GCP 관측 VM은 별도 target 파일만 바꾸고 로컬 기본값은 아래 파일을 사용한다.
      - files:
          - /etc/prometheus/targets/embedding-provider.yml
