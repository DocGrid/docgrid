groups:
  - name: docgrid-backend
    rules:
      - alert: DocGridBackendDown
        expr: up{job="docgrid-backend"} == 0
        for: 1m
        labels:
          severity: critical
          service: docgrid-backend
        annotations:
          summary: DocGrid Backend is unavailable
          description: Prometheus has failed to scrape the Backend for one minute.
          runbook_url: https://github.com/DocGrid/docgrid/blob/develop/docs/runbooks/backend-down.md

      - alert: DocGridDatabasePoolSaturated
        expr: |
          (
            hikaricp_connections_active{job="docgrid-backend"}
            /
            clamp_min(
              hikaricp_connections_max{job="docgrid-backend"},
              1
            )
          ) > 0.90
        for: 2m
        labels:
          severity: warning
          service: docgrid-backend
        annotations:
          summary: DocGrid Backend database pool is saturated
          description: More than 90% of the HikariCP pool has been active for two minutes.

      - alert: DocGridBackendHighServerErrorRatio
        expr: |
          (
            sum by (cluster, environment) (
              rate(http_server_requests_seconds_count{
                job="docgrid-backend",
                status=~"5..",
                uri!="/mcp"
              }[5m])
            )
            /
            clamp_min(
              sum by (cluster, environment) (
                rate(http_server_requests_seconds_count{
                  job="docgrid-backend",
                  uri!="/mcp"
                }[5m])
              ),
              0.001
            )
          ) > 0.05
          and
          sum by (cluster, environment) (
            increase(http_server_requests_seconds_count{
              job="docgrid-backend",
              uri!="/mcp"
            }[5m])
          ) >= 20
        for: 3m
        labels:
          severity: warning
          service: docgrid-backend
        annotations:
          summary: DocGrid Backend server error ratio is high
          description: More than 5% of at least 20 requests returned 5xx during the last five minutes.

      - alert: DocGridStorageOrphanInspectionFailed
        expr: |
          increase(docgrid_storage_orphan_inspections_total{
            job="docgrid-backend",
            outcome="failed"
          }[30h]) > 0
        for: 5m
        labels:
          severity: warning
          service: docgrid-backend
        annotations:
          summary: DocGrid storage orphan inspection failed
          description: At least one full storage orphan inspection failed during the last 30 hours.
          runbook_url: https://github.com/DocGrid/docgrid/blob/develop/docs/runbooks/storage-orphan-inspection.md

      - alert: DocGridStorageOrphanInspectionStale
        expr: |
          docgrid_storage_orphan_snapshot_age_seconds{
            job="docgrid-backend"
          } > 108000
        for: 30m
        labels:
          severity: warning
          service: docgrid-backend
        annotations:
          summary: DocGrid storage orphan inspection is stale
          description: No full storage orphan inspection has completed for more than 30 hours.
          runbook_url: https://github.com/DocGrid/docgrid/blob/develop/docs/runbooks/storage-orphan-inspection.md
