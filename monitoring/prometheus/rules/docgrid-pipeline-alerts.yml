groups:
  - name: docgrid-async-pipelines
    rules:
      - alert: DocGridEmbeddingRetryableFailureRatioHigh
        expr: |
          (
            sum by (cluster, environment) (
              rate(docgrid_embedding_job_attempts_total{
                outcome=~"retry_scheduled|terminal_failure",
                retryable="true"
              }[10m])
            )
            /
            clamp_min(
              sum by (cluster, environment) (
                rate(docgrid_embedding_job_attempts_total[10m])
              ),
              0.001
            )
          ) > 0.10
          and
          sum by (cluster, environment) (
            increase(docgrid_embedding_job_attempts_total[10m])
          ) >= 10
        for: 5m
        labels:
          severity: warning
          service: embedding-worker
          dependency: embedding-provider
        annotations:
          summary: DocGrid embedding retryable failure ratio is high
          description: More than 10% of at least 10 embedding attempts failed with a retryable cause during the last ten minutes.

      - alert: DocGridRagProviderFallbackSpike
        expr: |
          sum by (cluster, environment) (
            increase(docgrid_rag_job_completions_total{
              outcome="provider_fallback"
            }[10m])
          ) >= 3
        for: 1m
        labels:
          severity: warning
          service: rag-worker
          dependency: ollama
        annotations:
          summary: DocGrid RAG provider fallback is increasing
          description: At least three RAG jobs used the provider fallback during the last ten minutes.

      - alert: DocGridRagTimeoutSweepSpike
        expr: |
          sum by (cluster, environment) (
            increase(docgrid_rag_job_completions_total{
              outcome="timeout_swept"
            }[10m])
          ) >= 3
        for: 1m
        labels:
          severity: warning
          service: rag-worker
        annotations:
          summary: DocGrid RAG timeout recovery is increasing
          description: At least three RAG jobs were force-failed by the timeout sweeper during the last ten minutes.

      - alert: DocGridSyncOutboxTerminalFailure
        expr: |
          sum by (cluster, environment) (
            increase(docgrid_sync_event_attempts_total{
              outcome="terminal_failure"
            }[15m])
          ) > 0
        labels:
          severity: critical
          service: sync-outbox
        annotations:
          summary: A DocGrid Sync Outbox event reached terminal failure
          description: At least one Sync Outbox event exhausted retries during the last fifteen minutes.

      - alert: DocGridEmbeddingWorkersUnavailable
        expr: |
          max by (cluster, environment) (
            docgrid_embedding_claimable_jobs
          ) > 0
          and
          max by (cluster, environment) (
            docgrid_embedding_active_workers
          ) == 0
        for: 1m
        labels:
          severity: critical
          service: embedding-worker
        annotations:
          summary: DocGrid embedding queue has no active workers
          description: Claimable embedding jobs have been waiting without a live worker for one minute.

      - alert: DocGridEmbeddingQueueStalled
        expr: |
          max by (cluster, environment) (
            docgrid_embedding_claimable_jobs
          ) > 0
          and
          max by (cluster, environment) (
            docgrid_embedding_oldest_claimable_age_seconds
          ) > 300
        for: 5m
        labels:
          severity: warning
          service: embedding-worker
          dependency: embedding-provider
        annotations:
          summary: DocGrid embedding queue is stalled
          description: The oldest claimable embedding job has remained eligible for more than five minutes.

      - alert: DocGridRagQueueStalled
        expr: |
          max by (cluster, environment) (
            docgrid_rag_processing_jobs
          ) > 0
          and
          max by (cluster, environment) (
            docgrid_rag_oldest_processing_age_seconds
          ) > 150
        for: 30s
        labels:
          severity: warning
          service: rag-worker
        annotations:
          summary: DocGrid RAG queue is stalled
          description: The oldest RAG response has remained in PROCESSING for more than 150 seconds.

      - alert: DocGridSyncOutboxQueueStalled
        expr: |
          max by (cluster, environment) (
            docgrid_sync_outbox_claimable_events
          ) > 0
          and
          max by (cluster, environment) (
            docgrid_sync_outbox_oldest_claimable_age_seconds
          ) > 120
        for: 2m
        labels:
          severity: warning
          service: sync-outbox
        annotations:
          summary: DocGrid Sync Outbox queue is stalled
          description: The oldest claimable Sync Outbox event has remained eligible for more than two minutes.

      - alert: DocGridOperationalSnapshotStale
        expr: |
          max by (cluster, environment) (
            docgrid_operational_snapshot_age_seconds
          ) > 60
        for: 1m
        labels:
          severity: critical
          service: docgrid-backend
        annotations:
          summary: DocGrid operational metrics snapshot is stale
          description: The Backend has not completed an operational DB snapshot refresh for more than one minute.
