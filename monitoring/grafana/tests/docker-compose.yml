services:
  metrics-fixture:
    image: python:3.14-alpine
    command: ["python3", "-m", "http.server", "8000", "--directory", "/fixture"]
    volumes:
      - ./backend-metrics.txt:/fixture/backend-metrics.txt:ro
      - ./provider-metrics.txt:/fixture/provider-metrics.txt:ro

  prometheus:
    image: prom/prometheus:v3.5.5
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../prometheus/rules:/etc/prometheus/rules:ro

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_TEST_PORT}:3000"
    volumes:
      - ../provisioning:/etc/grafana/provisioning:ro
      - ../dashboards:/etc/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:3000/api/health"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
