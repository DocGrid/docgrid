global:
  scrape_interval: 1s
  evaluation_interval: 1s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: docgrid-backend
    metrics_path: /backend-metrics.txt
    static_configs:
      - targets:
          - metrics-fixture:8000
        labels:
          environment: test
          cluster: docgrid-test

  - job_name: embedding-provider
    metrics_path: /provider-metrics.txt
    static_configs:
      - targets:
          - metrics-fixture:8000
        labels:
          environment: test
          cluster: docgrid-test
