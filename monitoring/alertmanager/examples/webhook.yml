global:
  resolve_timeout: 5m

route:
  receiver: webhook
  group_by: [alertname, cluster, environment, severity, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: webhook
      matchers: [severity="critical"]
      group_wait: 10s
      repeat_interval: 1h

receivers:
  - name: webhook
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/webhook-url
        send_resolved: true

inhibit_rules:
  - source_matchers: [severity="critical", service="embedding-provider"]
    target_matchers: [severity="warning", service="embedding-provider"]
    equal: [cluster, environment]
  - source_matchers: [severity="critical", service="embedding-provider"]
    target_matchers: [dependency="embedding-provider"]
    equal: [cluster, environment]
