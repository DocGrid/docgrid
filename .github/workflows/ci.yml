name: CI

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  demo-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Test demo decisions without external services
        run: python3 -m unittest discover -s scripts/demo -p 'test_*.py' -v

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # test 프로필 기본 접속값(localhost:55432, app/local_password)에 맞춘다.
      # OpenSqlCompatibilityIntegrationTest가 서버 17.8·pgvector 0.8.1을 단언하므로 태그가 아닌 digest로 고정한다.
      postgres:
        image: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: local_password
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # 로그아웃 블랙리스트·STOMP 역할 회수 통합 테스트가 실제 Redis 프로토콜 서버를 사용한다.
      valkey:
        image: valkey/valkey:9.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # CI 전용 서명 키다. 운영·로컬 시크릿과 무관하다.
      JWT_SECRET: docgrid-ci-test-only-jwt-secret-not-for-production
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      # 여러 Spring Context의 연결 풀 합계가 PostgreSQL max_connections(100)를 넘지 않게 한다.
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # 로컬은 docker/postgres/init/001-enable-vector.sql이 만드는 확장을 Flyway 실행 전에 준비한다.
      - name: Enable pgvector extension
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U app -d app -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS vector WITH SCHEMA public" \
            -c "SHOW server_version" \
            -c "SELECT extversion FROM pg_extension WHERE extname = 'vector'"

      - name: Build and test
        run: ./backend/gradlew -p backend build --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend/build/test-results/test/
            backend/build/reports/tests/test/
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Lint
        run: npm --prefix frontend run lint

      # test 스크립트가 production 빌드를 먼저 실행한다.
      - name: Build and test
        run: npm --prefix frontend test
