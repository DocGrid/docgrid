name: Local demo reproducibility

on:
  pull_request:
    paths:
      - .github/workflows/demo-reproducibility.yml
      - scripts/demo/reproduce_fresh.py
      - scripts/demo/browser_smoke.cjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-reproduction-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  fresh-search-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EMBEDDING_CONTAINER_CPUS: "2.0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Prepare isolated Chromium dependency
        env:
          DEMO_BROWSER_MODULE: ${{ runner.temp }}/docgrid-demo-browser/node_modules/playwright
        run: |
          npm install --prefix "$RUNNER_TEMP/docgrid-demo-browser" --no-save --package-lock=false playwright@1.64.1
          node "$DEMO_BROWSER_MODULE/cli.js" install --with-deps chromium
      - name: Reproduce start, verify, browser and stop with real BGE-M3
        env:
          DEMO_BROWSER_MODULE: ${{ runner.temp }}/docgrid-demo-browser/node_modules/playwright
        run: python3 scripts/demo/reproduce_fresh.py
      - name: Preserve redacted per-purpose evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: local-demo-reproduction-${{ github.run_id }}-${{ github.run_attempt }}
          path: .demo/reproduction/
          if-no-files-found: warn
